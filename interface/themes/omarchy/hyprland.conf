# Hyprland Cyberdeck Theme (surface.amdy.hyprland)
# Governed by ISA-KAD-AESTHETIC-001

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(68d5e8) rgb(1a080a) 45deg
    col.inactive_border = rgb(303746)
    layout = dwindle
    no_border_on_floating = false
}

decoration {
    rounding = 2
    active_opacity = 0.98
    inactive_opacity = 0.88
    dim_inactive = true
    dim_strength = 0.15

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(07090eee)
    }
}

animations {
    enabled = true
    bezier = cyberdeck, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 2, cyberdeck, slide
    animation = windowsOut, 1, 2, cyberdeck, slide
    animation = border, 1, 2, cyberdeck
    animation = fade, 1, 2, cyberdeck
    animation = workspaces, 1, 2, cyberdeck, slide
}
