modelRoleStorage: project
modelRoles:
  default: openai-codex/gpt-5.6-luna:max
  task: openai-codex/gpt-5.6-luna:low
  advisor: google-antigravity/gemini-3.8-flash:low
  designer: google-antigravity/gemini-3.8-flash:high
  vision: google-antigravity/gemini-3.8-flash:high
  plan: opencode-go/deepseek-v4.1-flash:high
  slow: openai-codex/gpt-5.6-terra:high
  verifier: google-antigravity/gemini-3.1-pro:high
  research: google-antigravity/gemini-3.1-pro:low
  oracle: openai-codex/gpt-5.6-terra:max
  smol: kad-local-qwen/qwen-local:low
  tiny: zai-free/glm-4.7-flash:minimal
  commit: zai-free/glm-4.7-flash:low
  world: kad-local-world/kad-local-s13:low
  local_retrieval: kad-local-qwen/qwen-local:low
  local_general: kad-local-world/kad-local-s13:low
  rpg: kad-local-world/rp-hero:low
modelTags:
  oracle:
    name: Oracle (manual premium escalation)
    hidden: true
  verifier:
    name: Verifier (independent provider-family review)
  research:
    name: Research (literature and technical synthesis)
  world:
    name: World (Stheno WORLD-only)
  local_retrieval:
    name: Local Retrieval (Qwen retrieval-only)
  local_general:
    name: Local General (unqualified)
    hidden: true
  rpg:
    name: RPG (RP-Hero roleplay)
cycleOrder:
  - default
  - plan
  - slow
  - smol
  - world
  - local_retrieval
  - rpg
enabledModels:
  - google-antigravity/*
  - openai-codex/*
  - opencode-go/*
  - zai-free/*
  - kad-local-world/*
  - kad-local-qwen/*
  # Single OpenAI-compatible transport for local + subscription models. The
  # provider block in .omp/models.yml is projected by `bin/kad-models sync` and
  # carries only policy-exposed ids (no metered models). See
  # config/omniroute-exposure.json.
  - omniroute/*
disabledProviders:
  - openrouter
advisor:
  enabled: false
memory:
  backend: mnemopi
autolearn:
  enabled: true
  autoContinue: false
extendedContext: true
contextPromotion:
  enabled: false
compaction:
  enabled: true
  methodOrder:
    - snapcompact
    - handoff
    - shake
    - soft
  thresholdPercent: 70
  thresholdTokens: -1
  midTurnEnabled: true
  keepRecentTokens: 20000
  autoContinue: true
skillful: false
skills:
  enabled: true
  enableAgentsProject: true
  enablePiProject: false
task:
  enableEffort: false
  agentModelOverrides:
    kad-master: "@plan"
    kad-builder: "@task"
    kad-tester: "@verifier"
    kad-reviewer: "@verifier"
    kad-researcher: "@research"
    kad-local-world: "@world"
    kad-local-extractor: "@local_retrieval"
    scout: "@smol"
    sonic: "@tiny"
    designer: "@designer"
    reviewer: "@verifier"
    security-reviewer: "@verifier"
    librarian: "@local_retrieval"
  agentAdvisor:
    kad-master: "off"
    kad-builder: "off"
    kad-tester: "off"
    kad-reviewer: "off"
    kad-researcher: "off"
    kad-local-world: "off"
    kad-local-extractor: "off"
    scout: "off"
    sonic: "off"
    designer: "off"
    reviewer: "off"
    security-reviewer: "off"
    librarian: "off"
retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - google-antigravity/gemini-3.8-flash:low
      - openai-codex/gpt-5.6-luna:low
    task:
      - opencode-go/deepseek-v4-flash:low
      - google-antigravity/gemini-3.8-flash:low
    plan:
      - openai-codex/gpt-5.6-terra:high
      - google-antigravity/gemini-3.1-pro:high
      - google-antigravity/gemini-3.8-flash:low
    slow:
      - opencode-go/deepseek-v4-pro:high
      - google-antigravity/gemini-3.1-pro:high
      - google-antigravity/gemini-3.8-flash:low
    smol:
      - zai-free/glm-4.7-flash:minimal
tools:
  approvalMode: yolo
  xdevDocs: catalog
secrets:
  enabled: false
ttsr:
  enabled: false
recap:
  enabled: false