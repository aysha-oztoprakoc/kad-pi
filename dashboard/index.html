<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sofia v3 — KAD-PI Canonical Cockpit</title>
  <link rel="stylesheet" href="../interface/kad.css">
  <script type="importmap">
  {
    "imports": {
      "cytoscape": "/vendor/cytoscape.esm.min.mjs",
      "echarts": "/vendor/echarts.esm.min.mjs"
    }
  }
  </script>
</head>
<body class="dashboard">
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-text">SOFIA v3 / CANONICAL COCKPIT</span>
      </a>
      <div class="meta">
        <span>LOCAL / READ-ONLY</span>
        <span id="projection-status">STATE LOADING</span>
      </div>
    </div>
  </header>

  <main>
    <div class="shell dashboard-shell">
      <nav class="side-nav" aria-label="Sofia Navigation">
        <a href="#overview" data-view="overview" aria-current="page">Overview</a>
        <a href="#graph" data-view="graph">Graph Explorer</a>
        <a href="#projects" data-view="projects">Projects</a>
        <a href="#workpackages" data-view="workpackages">Workpackages</a>
        <a href="#research" data-view="research">Research</a>
        <a href="#telemetry" data-view="telemetry">Telemetry HUD</a>
        <a href="#system" data-view="system">System</a>
      </nav>

      <section class="dashboard-content" id="dashboard-content">
        <div class="loading">Loading canonical projections…</div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="shell footer-inner">
      <span>Derived state only · Canonical source of truth: <code class="mono">vault/</code></span>
      <span id="loaded-from">Checking vault revision…</span>
    </div>
  </footer>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
